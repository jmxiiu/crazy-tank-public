<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crazy Tank Aiming Calculator</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; max-width: 500px; margin: auto; background: #000000; color: #f2f2f7; touch-action: manipulation; }
.input-group { margin: 16px 0; background: #1a1a1a; padding: 12px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
.value { font-size: 26px; font-weight: bold; text-align: center; margin: 8px 0; color: #ffffff; }
.buttons { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
button { font-size: 15px; padding: 8px 10px; border: none; border-radius: 8px; background: #0a84ff; color: white; cursor: pointer; min-width: 42px; touch-action: manipulation; }
button:active { background: #0066cc; }
input[type="range"] { width: 100%; margin: 8px 0; accent-color: #0a84ff; }
table { width: 100%; border-collapse: collapse; margin-top: 16px; background: #1a1a1a; border-radius: 12px; overflow: hidden; }
th, td { padding: 10px; text-align: center; border-bottom: 1px solid #3a3a3c; font-size: 15px; color: #f2f2f7; }
</style>
</head>
<body>
<div class="input-group">
  <div class="value" id="targetDisplay">48</div>
  <input type="range" id="targetSlider" min="0" max="96" value="48" oninput="setTarget(this.value)">
  <div class="buttons">
    <button onclick="changeTarget(-5)">−5</button>
    <button onclick="changeTarget(-3)">−3</button>
    <button onclick="changeTarget(-1)">−1</button>
    <button onclick="changeTarget(1)">+1</button>
    <button onclick="changeTarget(3)">+3</button>
    <button onclick="changeTarget(5)">+5</button>
  </div>
</div>

<table id="results">
  <tr><td>1/1</td><td id="fullAngle">-</td><td id="fullTweak">-</td></tr>
  <tr><td>1/2</td><td id="medAngle">-</td><td id="medTweak">-</td></tr>
  <tr><td>1/3</td><td id="smallAngle">-</td><td id="smallTweak">-</td></tr>
  <tr><td>1/4</td><td id="quarterAngle">-</td><td id="quarterTweak">-</td></tr>
</table>

<script>
let target = 48;

function updateDisplay() {
  document.getElementById('targetDisplay').textContent = target;
  document.getElementById('targetSlider').value = target;
  calculate();
}

function setTarget(val) {
  target = parseInt(val);
  updateDisplay();
}

function changeTarget(delta) {
  target = Math.max(0, Math.min(96, target + delta));
  updateDisplay();
}

function calculate() {
  const units = target / 4.8;
  const signedWind = 0; // no wind
  const forces = [
    { name: '1/1', dpu: 1, id: 'full' },
    { name: '1/2', dpu: 2, id: 'med' },
    { name: '1/3', dpu: 3, id: 'small' },
    { name: '1/4', dpu: 4, id: 'quarter' }
  ];

  forces.forEach(f => {
    const precise = 90 - (units * f.dpu) + signedWind;
    const integer = Math.floor(precise);
    const fromVertical = 90 - integer;
    const tweak = Math.abs(precise - integer) < 0.01 ? 'Exact' : 'LOW';
    document.getElementById(f.id + 'Angle').textContent = fromVertical + '°';
    document.getElementById(f.id + 'Tweak').textContent = tweak;
  });
}

updateDisplay();
</script>
</body>
</html>
